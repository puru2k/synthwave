# Static (backend-free) deploy of the SynthWave client.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

# Single-page app: serve index.html for any unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let the service worker control the whole origin and never be cached stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
